services:
  quartermaster:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: quartermaster:local
    container_name: quartermaster
    restart: unless-stopped
    ports:
      - "127.0.0.1:8800:80"      # loopback only; LAN/tailnet reach is a deliberate edit here or caddy
    environment:
      AGENT_URL: "http://host.docker.internal:8790"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent/agent.key:/run/secrets/agent.key:ro
