<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 340">
<defs>
<clipPath id="disc"><circle cx="160" cy="170" r="100"/></clipPath>
<mask id="eye" maskUnits="userSpaceOnUse" x="50" y="60" width="220" height="220">
<g clip-path="url(#disc)" fill="#fff"><rect x="60" y="71.5" width="200" height="2.9"/><rect x="60" y="80.3" width="200" height="5.9"/><rect x="60" y="90.6" width="200" height="8.8"/><rect x="60" y="105.3" width="200" height="8.8"/><rect x="60" y="118.5" width="200" height="8.9"/><rect x="60" y="133.2" width="200" height="23.6"/><rect x="60" y="162.65" width="200" height="14.7"/><rect x="60" y="183.2" width="200" height="23.6"/><rect x="60" y="212.6" width="200" height="8.9"/><rect x="60" y="225.9" width="200" height="8.8"/><rect x="60" y="240.6" width="200" height="8.8"/><rect x="60" y="253.8" width="200" height="5.9"/><rect x="60" y="265.6" width="200" height="2.9"/></g>
<circle cx="160" cy="170" r="52" fill="#fff"/>
<circle cx="160" cy="170" r="28" fill="#000"/><rect x="119" y="165.6" width="82" height="8.8" fill="#000"/>
<circle cx="160" cy="170" r="6" fill="#fff"/>
</mask>
