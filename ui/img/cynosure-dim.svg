<g id="name" font-family="'Perpetua Titling MT', 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-weight="700">
<text x="296" y="180" font-size="150" textLength="878" lengthAdjust="spacingAndGlyphs">CYNOSURE</text>
</g>
